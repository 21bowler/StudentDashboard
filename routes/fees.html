<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Fees Page</title>
  </head>
  <body>
    <div class="min-h-screen bg-[#ddd]">
      <!-- Header Content-->
      <header class="border-b border-gray-400">
        <div
          class="container mx-auto px-4 py-4 flex items-center justify-between"
        >
          <div>
            <h1 class="text-2xl font-bold">Student Portal</h1>
          </div>
        </div>
      </header>

      <!-- Main -->
      <main class="container mx-auto py-2 px-4">
        <a
          href="/"
          class="inline-flex items-center mb-6 gap-2 hover:text-blue-500 transition-all"
          ><svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-arrow-left-icon w-4 h-4 lucide-arrow-left"
          >
            <path d="m12 19-7-7 7-7" />
            <path d="M19 12H5" /></svg
          >Back</a
        >

        <!-- details -->
        <div class="max-w-2xl">
          <h1 class="text-3xl font-bold mb-8">Fee Statement</h1>

          <!-- Summary Cards -->
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="bg-[#fff] border border-gray-400 rounded-lg p-6">
              <p class="text-sm font-medium">Total Fees</p>
              <p class="text-2xl font-bold mt-2">KES 213,000</p>
            </div>
            <div class="bg-[#fff] border border-gray-400 rounded-lg p-6">
              <p class="text-sm font-medium">Amount Paid</p>
              <p class="text-2xl font-bold mt-2 text-green-600">KES 120,000</p>
            </div>
            <div class="bg-[#fff] border border-gray-400 rounded-lg p-6">
              <p class="text-sm font-medium">Balance Due</p>
              <p class="text-2xl font-bold mt-2 text-red-600">KES 93,000</p>
            </div>
          </div>

          <!-- Fee Breakdown -->
          <div
            class="bg-card border border-gray-400 rounded-lg overflow-hidden"
          >
            <div class="px-6 py-4 border-b border-border bg-gray-300">
              <h2 class="font-semibold text-foreground">Fee Breakdown</h2>
            </div>
            <div class="divide-y divide-gray-400">
              <div class="px-6 py-4 flex justify-between items-center">
                <span>Tuition</span>
                <span class="font-semibold">KES 150,000</span>
              </div>
              <div class="px-6 py-4 flex justify-between items-center">
                <span>Accomodation</span>
                <span class="font-semibold">KES 50,000</span>
              </div>
              <div class="px-6 py-4 flex justify-between items-center">
                <span>Library</span>
                <span class="font-semibold">KES 5,000</span>
              </div>
              <div class="px-6 py-4 flex justify-between items-center">
                <span>Technology</span>
                <span class="font-semibold">KES 8,000</span>
              </div>
            </div>
            <div
              class="px-6 py-4 bg-gray-300 flex justify-between items-center font-semibold"
            >
              <span class="text-foreground">Total</span>
              <span class="text-lg text-foreground">KES 213,000</span>
            </div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
